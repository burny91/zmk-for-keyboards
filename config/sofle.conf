# Battery report interval in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300
CONFIG_ADC=y

# Debounce configuration
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Increase BLE transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Keyboard name
CONFIG_ZMK_KEYBOARD_NAME="Sofle_Choc"

# Fix Windows battery reporting
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# Display Configuration
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Fetch peripheral battery level to central half
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ======================================================================
# Logitech MX Keys Mini Style Power Management
# ======================================================================

# Idle State (30 Sekunden)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Enable deep sleep support
CONFIG_ZMK_SLEEP=y

# Deep Sleep State (Controller & Displays schlafen nach 5 Minuten ein)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# ======================================================================

# ZMK Studio Configuration
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ======================================================================
# Logitech MX Keys Style Lighting (Static White / Soft Dimming)
# ======================================================================
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y

# Garantiert, dass der LED-Treiber beim Booten/Aufwachen aktiv bleibt
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

# WICHTIG: 'n' verhindert das dauerhafte Festfrieren des LED-Subsystems im Idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# 0 = Solid color (Einfarbig statt Regenbogen-Effekt)
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# 0% Sättigung = Reines Weißes Licht (wie MX Keys)
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0

# Standard-Starthelligkeit (40%)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=40

# Maximale Helligkeitsbegrenzung (60%) zum Akkuschonen
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# Rotary Encoder Configuration
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
